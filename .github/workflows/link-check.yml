name: link-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # External links rot without a commit to trigger a rerun, so a dormant repo
  # would otherwise never find out.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    uses: gojiplus/r-canon/.github/workflows/reusable-link-check.yml@add-link-check-and-pin-actions
    with:
      # Service endpoints that appear in R/ as string constants, not documents:
      # both answer 404 to an unauthenticated GET by design. The OAuth scope
      # URIs under /auth/ do resolve and stay checked.
      exclude: |
        ^https://www\.googleapis\.com/?$
        ^https://youtubeanalytics\.googleapis\.com
